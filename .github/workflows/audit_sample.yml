name: Audit Sample Extraction

# 분류 품질 측정용 감사 샘플 추출 (측정 가이드 Phase 2).
# sentiment별 50건씩 랜덤 샘플링한 CSV를 audit-data 브랜치에 커밋한다.
# 실행 방법 (라벨링 라운드가 필요할 때마다):
#   1. Actions 탭에서 수동 실행 (workflow_dispatch), 또는
#   2. run-audit-sample 브랜치에 푸시 (API 토큰에 actions:write가 없을 때의 우회로)

on:
  workflow_dispatch:
  push:
    branches:
      - run-audit-sample

permissions:
  contents: write

jobs:
  extract-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Create pipeline .env
        run: |
          cat > pipeline/.env << EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      - name: Install dependencies
        working-directory: pipeline
        run: uv sync

      - name: Run sample extraction
        working-directory: pipeline
        run: uv run python scripts/sample_for_audit.py

      - name: Push CSV to audit-data branch
        run: |
          CSV=$(ls pipeline/audit_sample_*.csv | head -1)
          echo "추출된 파일: $CSV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B audit-data
          git add "$CSV"
          git commit -m "chore: 감사용 분류 샘플 추출 ($(basename "$CSV"))"
          git push -f origin audit-data

      - name: Upload CSV as artifact (백업 경로)
        uses: actions/upload-artifact@v4
        with:
          name: audit-sample-csv
          path: pipeline/audit_sample_*.csv
          retention-days: 30
