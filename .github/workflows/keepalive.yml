name: Workflow Keepalive

# 공개 레포는 60일 동안 커밋이 없으면 GitHub가 예약 실행(cron)을 자동으로 끈다.
# 2026-09-19에 Voice Tracker Pipeline이 이렇게 멈췄고, DB 접근이 끊기자
# Supabase 무료 프로젝트(legion-voice)까지 비활성으로 일시정지됐다.
# 이 워크플로는 주 1회 GitHub API로 예약 워크플로를 다시 enable 해서 60일 카운트를 리셋한다.
# 더미 커밋 없음, 외부 액션 없음 (gh CLI만 사용, liskin/gh-workflow-keepalive 와 같은 방식).

on:
  schedule:
    - cron: '23 3 * * 1'   # 매주 월요일 12:23 KST
  workflow_dispatch:

permissions:
  actions: write   # 워크플로 enable API 호출에 필요

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in pipeline.yml keepalive.yml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable"
            echo "re-enabled: ${wf}"
          done
