name: Voice Tracker Pipeline

on:
  schedule:
    - cron: '0 */2 * * *'   # 2시간마다 자동 실행 (KST 기준 짝수 시)
  workflow_dispatch:          # GitHub에서 수동 실행 버튼
    inputs:
      reset_classifications:
        description: '기존 분류를 모두 초기화하고 재분류 (중립 제거 등 새 기준 적용)'
        type: boolean
        default: false

permissions:
  contents: read   # 체크아웃만 필요 — 기본 토큰 권한 최소화

# 예약 실행과 수동 실행이 겹치면 같은 미분류 글을 두 번 처리(Gemini 이중 호출)하므로 직렬화
concurrency:
  group: voice-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true        # uv 패키지 캐시

      - name: Create pipeline .env
        run: |
          cat > pipeline/.env << EOF
          INVEN_USER_AGENT=legion-voice-tracker/0.1 (aion2-community-sentiment; contact: magnolia0097@gmail.com)
          INVEN_REQUEST_INTERVAL=3.0
          INVEN_BOARD_IDS=6388,6438,6448,6449,6450,6451,6452,6453,6454
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL=gemini-2.5-flash-lite
          CLASSIFIER_MODE=hybrid
          GEMINI_CALLS_PER_RUN=12
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      - name: Install dependencies
        working-directory: pipeline
        run: uv sync --locked   # uv.lock과 어긋나면 실패 → 운영에서 의존성이 몰래 바뀌지 않게

      - name: Run pipeline
        working-directory: pipeline
        env:
          RESET_CLASSIFICATIONS: ${{ github.event.inputs.reset_classifications }}
          # 1로 바꾸면 치명적 품질 경고(LLM 인증 오류 등) 시 실행을 실패 처리 → GitHub 실패 알림 메일
          PIPELINE_STRICT: '0'
        # 실행 요약 표는 실행 페이지 Summary 탭에 출력된다 (src/summary.py)
        run: uv run python scripts/run_pipeline.py
