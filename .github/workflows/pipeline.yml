name: Voice Tracker Pipeline

on:
  schedule:
    - cron: '0 */2 * * *'   # 2시간마다 자동 실행 (KST 기준 짝수 시)
  workflow_dispatch:          # GitHub에서 수동 실행 버튼

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Create pipeline .env
        run: |
          cat > pipeline/.env << EOF
          INVEN_USER_AGENT=legion-voice-tracker/0.1 (aion2-community-sentiment; contact: magnolia0097@gmail.com)
          INVEN_REQUEST_INTERVAL=3.0
          INVEN_BOARD_IDS=6388,6444,6447
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL=gemini-2.5-flash
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      - name: Install dependencies
        working-directory: pipeline
        run: uv sync

      - name: Run pipeline
        working-directory: pipeline
        run: uv run python scripts/run_pipeline.py
