name: Secret Scan

# gitleaks로 이번 push/PR에 새로 들어온 커밋만 검사한다.
# 과거 히스토리의 노출 건(docs/SECURITY_NOTES.md 참조)은 키 재발급으로 대응했으므로
# 매 push마다 다시 실패시키지 않는다. 전체 히스토리 재점검은 수동 실행(full_history)으로.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: '전체 히스토리 스캔 (과거 노출 건이 남아 있으면 실패하는 게 정상)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.24.3
  # https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt
  GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (전체 히스토리 — 커밋 범위 계산용)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (버전·체크섬 고정)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Decide commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ github.event.inputs.full_history }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL" = "true" ]; then
            echo "log_opts=--all" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ]; then
            echo "log_opts=${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "log_opts=${BEFORE}..${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            # 새 브랜치 첫 push / force push → 기본 브랜치에 없는 커밋만
            echo "log_opts=origin/${DEFAULT_BRANCH}..${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan (값은 로그에 출력하지 않음)
        run: |
          echo "scan range: ${{ steps.range.outputs.log_opts }}"
          gitleaks git --redact --no-banner --verbose \
            --log-opts="${{ steps.range.outputs.log_opts }}" .
