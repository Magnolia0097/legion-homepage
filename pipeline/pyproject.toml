[project]
name = "voice-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "supabase>=2.8",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.32",
    # 로컬 한국어 감성 트랜스포머 (CLASSIFIER_MODE=transformer)
    "transformers>=4.44",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

# torch는 기본 인덱스가 CUDA 빌드(2GB+)라 CPU 전용 휠로 강제 — 러너 설치 시간 단축
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
