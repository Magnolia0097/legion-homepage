[project]
name = "voice-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "supabase>=2.8",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.32",
]
# 참고: CLASSIFIER_MODE=transformer 로컬 BERT를 쓰려면 transformers·torch 추가 필요.
# 현재 기본은 hybrid(키워드+Gemini)라 무거운 ML 의존성을 두지 않는다.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
