[project]
name = "voice-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "supabase>=2.8",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
