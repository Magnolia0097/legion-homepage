name = "legion-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 데이터베이스 바인딩
# database_id는 `wrangler d1 create legion-db` 실행 후 출력값으로 교체
[[d1_databases]]
binding = "DB"
database_name = "legion-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# R2 스토리지 바인딩
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "legion-bucket"

# 환경변수
[vars]
FIREBASE_PROJECT_ID = "REPLACE_WITH_YOUR_FIREBASE_PROJECT_ID"
ADMIN_EMAILS = "REPLACE_WITH_ADMIN_EMAIL@gmail.com"
