name = "legion-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 데이터베이스 바인딩
# database_id는 `wrangler d1 create legion-db` 실행 후 출력값으로 교체
[[d1_databases]]
binding = "DB"
database_name = "legion-db"
database_id = "0606355d-ef53-41d4-8d92-456f3ee75ef9"

# R2 스토리지 바인딩
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "legion-bucket"

# 환경변수
[vars]
FIREBASE_PROJECT_ID = "legion-homepage"
ADMIN_EMAILS = "magnolia0097@gmail.com"
