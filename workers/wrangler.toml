name = "legion-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 데이터베이스 바인딩
# database_id는 `wrangler d1 create legion-db` 실행 후 출력값으로 교체
[[d1_databases]]
binding = "DB"
database_name = "legion-db"
database_id = "0606355d-ef53-41d4-8d92-456f3ee75ef9"

# R2 스토리지 바인딩
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "legion-bucket"

# 환경변수
[vars]
FIREBASE_PROJECT_ID = "legion-homepage"
SUPER_ADMIN_EMAILS = "magnolia0097@gmail.com"
# 이메일 발신 주소 (Resend에서 인증된 도메인의 주소)
RESEND_FROM_EMAIL = "onboarding@resend.dev"

# Workers AI 바인딩
[ai]
binding = "AI"

# ─── 이메일 전송 시크릿 (아래 명령으로 설정) ───
# wrangler secret put RESEND_API_KEY
# → Resend (resend.com) 가입 후 발급받은 API Key 입력
